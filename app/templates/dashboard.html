<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>

    <h1>Welcome, {{ current_user.username }}!</h1>

    {% if current_user.role == "admin" %}
        <p>
            <a href="{{ url_for('admin.admin_home') }}">
                Admin Dashboard
            </a>
        </p>
    {% endif %}

    <p> 
        <a href="{{ url_for('files.upload') }}"> 
            Upload a File 
        </a> 
    </p>

    <h2>Your Files</h2>

    {% for file in files %}

        <p>
            <strong>{{ file.filename }}</strong>

            <a href="{{ url_for('files.download_file', file_id=file.id) }}">
                Download
            </a>

            <form method="POST"
                  action="{{ url_for('files.delete_file', file_id=file.id) }}"
                  style="display:inline;">

                <button type="submit">
                    Delete
                </button>

            </form>

            <form method="POST"
                  action="{{ url_for('files.share_file', file_id=file.id) }}"
                  style="display:inline;">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <button type="submit">
                    Share
                </button>

            </form>

        </p>

    {% else %}

        <p>You don't have any files yet.</p>

    {% endfor %}

    <p>
        <a href="{{ url_for('auth.logout') }}">
            Logout
        </a>
    </p>

</body>

</html>
